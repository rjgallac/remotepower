<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Power Management</title>
    <link rel="stylesheet" href="/styles.css" ></link>
</head>
<body>
    <div class="container">
        <h1>🖥️ Remote Power Control</h1>
        <p class="subtitle">Linux Laptop (192.168.1.220)</p>

        <div class="status-section">
            <div class="status-label">LAPTOP STATUS</div>
            <div>
                <span class="status-indicator checking" id="statusIndicator"></span>
                <div class="status-text" id="statusText">Checking...</div>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div class="button-group">
            <button class="btn-start" id="btnStart" onclick="startLaptop()">🔌 Start</button>
            <button class="btn-shutdown" id="btnShutdown" onclick="shutdownLaptop()">⏹️ Shutdown</button>
        </div>

        <div class="refresh-section">
            <button class="btn-refresh" id="btnRefresh" onclick="checkStatus()">↻ Check Status</button>
        </div>

        <div class="info-box">
            <strong>How it works:</strong><br>
            • <strong>Start:</strong> Sends Wake-on-LAN magic packet<br>
            • <strong>Shutdown:</strong> Uses SSH to remotely shut down<br>
            • Status updates every 30 seconds
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
